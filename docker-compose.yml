services:
  mongodb:
    image: mongo:latest
    container_name: asset_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: asset_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # порт для підключення Celery (AMQP)
      - "15672:15672" # веб-інтерфейс RabbitMQ у браузері
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mongo_data: